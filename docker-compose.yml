services:
  postgres:
    image: postgres:16-alpine
    container_name: finaccess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartfin_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - finaccess-postgres-data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./backend/database/003-registration.sql:/docker-entrypoint-initdb.d/003-registration.sql:ro
      - ./backend/database/004-profile-avatar.sql:/docker-entrypoint-initdb.d/004-profile-avatar.sql:ro
      - ./backend/database/005-password-reset.sql:/docker-entrypoint-initdb.d/005-password-reset.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartfin_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: finaccess-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartfin_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5001:5000"

volumes:
  finaccess-postgres-data:
